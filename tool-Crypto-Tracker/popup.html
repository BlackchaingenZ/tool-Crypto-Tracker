<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <center>
        <h2>Tool Check Coin</h2>
        <p>Build by: Ngọc Nguyên</p>
        <p>Liên hệ Telegram: ngocnguyen2k02</p>
    </center>
    <div id="login-container">
        <input type="text" id="key-input" placeholder="Nhập mã khoá">
        <button id="submit-key">Xác nhận</button>
        <div id="error-message" style="color: red; display: none;"></div>
    </div>

    <div id="main-content" style="display: none;">

        <div><input type="text" id="searchInput" placeholder="Tìm kiếm coin..."></div>
        <div class="controls">
            <button id="refreshData">✔Reload</button>
            <button id="filterOversold">Lọc RSI &lt;30</button>
            <button id="filterOverbought">Lọc RSI >70</button>
            <button id="filterHighVolume">Lọc Volume</button>
        </div>
        <div id="resultsContainer"></div>
    </div>
    <script src="auth.js" type="module"></script>
    <script src="popup.js" type="module"></script>
